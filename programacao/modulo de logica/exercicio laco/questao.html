<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n1 = Number(prompt("digite o numero:"))
    
        while(true){
            if(n1 >= 10 && n1 <= 25 ){
              document.write("entrada valida com sucesso")
              break
        }else{
            document.write("entrada invalida")
            break
            
        }
    }
           
      
    
    
    </script>
</body>
</html>
