<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x = 1

        while(x <= 15){
            nome = prompt("digite o seu nome:")
            nota1 = Number(prompt("digite a primeira nota: "))
            nota2 = Number(prompt("digite a segunda nota:"))
            nota1 = nota1 + nota2 
            media = nota1/2
            if(media >= 5.5){
                document.write(nome + " - " + "ficou com a média da nota:  " + media + " = " + "aprovado" + "<br>" )
            }else{
                document.write(nome + " - " + "ficou com a média da nota:  " + media + " = " + "reprovado" + "<br>" )
            }
            x++
        }
    </script>
</body>
</html>
