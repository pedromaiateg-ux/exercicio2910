<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let n1 = Number(prompt("Digite um número:"))
    let x = n1
    let fatorial = 1

    while(x > 0){
    fatorial = fatorial * x
    x--
}

    document.write("O fatorial é: " + fatorial)
    </script>
</body>
</html>
