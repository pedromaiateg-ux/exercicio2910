<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let x = 0
let idade = 21
let sexo = "masculino"

while(x < 20){

    let n1 = prompt("Qual é o seu nome:")
    let n2 = prompt("Qual é o seu sexo:")
    let n3 = Number(prompt("Digite a sua idade:"))

    if(n2 == sexo && n3 == idade){
        document.write(n1 + " tem 21 anos e é masculino.<br>")
    }

    x++
}
    </script>
