<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let x = 0
    let x1 = Number(prompt("digite um numero:"))

    while(x <= x1){
    if(x % 3 == 0 && x % 5 == 0){
        document.write("O número é múltiplo de 3 e 5: " + x + "<br>")
    }

    x++
}
    </script>
</body>
</html>
