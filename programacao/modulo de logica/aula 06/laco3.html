<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let x = 1 
let par = 0
let impar = 0
while(x <= 10){
    numero = Number(prompt("digite o numero"))
    if(numero % 2== 0 ){
        ++par
    }else{
        ++impar

    }
    ++x
    }
document.write("o total de n° pares é:" + par)
document.write("o total de n° impares é:" + impar)

</script>
  
</body>
</html>
