<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soma de valores </title>
</head>
<body>
    <script>
       let x = 1 
       let numero = 0
       let total = 0
       let quantidade = 0

       while(x <= 5){
        numero = Number(prompt("digite o numero"))
    total += numero
    x++
    quantidade++
       }
       document.write(quantidade)
       document.write("o valor da soma do n° é:" + (total/quantidade.tofixed(2)))
    </script>
</body>
</html>
