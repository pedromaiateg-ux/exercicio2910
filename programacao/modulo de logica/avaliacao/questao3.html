<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let comeco = Number(prompt("primeiro numero:"))
        let final = Number(prompt("digite o numero final:"))

        while(comeco <= final){
    
            document.write("a soma é" + (comeco * final))
            ++comeco
            
        }
    </script>
</body>
</html>
