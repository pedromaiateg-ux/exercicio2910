<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
          
     let produtos = [
            {id: 1, nome: "Caderno", preco: 12},
            {id: 2, nome: "Régua", preco: 8},
            {id: 3, nome: "Livro", preco: 120}
        ]
        let opcao = Number(prompt(
            "MENU\n\n"+
            "1 - Cadastrar produtos\n" +
            "2 - Listar Produtos\n" +
            "3 - Atualizar produtos\n" +
            "4 - Excluir produtos"
        ))
        if(opcao == 1){
            let id = Number(prompt("Digite o ID: "))
            let nome = prompt("Digite seu nome ")
            let preco = Number(prompt("Digite o preço "))
            
            let novoProduto={
                id: id,
                nome: nome,
                preco: preco
            }
            produtos.push(novoProduto)
            document.write("<h1> Produto cadastrado!! <h1/>")
                produtos.forEach(produto => {
                document.write(
                "Id: " + produto.id + 
                " - Nome: " + produto.nome + 
                " - Preço: R$ " + produto.preco +
                "<br>"
            )
            })
            
        }else if(opcao === 2){
            document.write("<h1>Lista de produtos</h1>")
            produtos.forEach(produto => {
                document.write(
                "Id: " + produto.id + 
                " - Nome: " + produto.nome + 
                " - Preço: R$ " + produto.preco +
                "<br>"
            )
            })
            
        }else if(opcao === 3){
            let idvariavel = Number(prompt("Digite o ID"))
            let produto = produtos.find(produto => produto.id === idvariavel)
            if(produto){
                let novoNome = prompt("Digite o novo nome: ")
                let novoPreco = Number(prompt("Digite o novo preço: "))

                produto.nome = novoNome
                produto.preco = novoPreco
                document.write("<h1>Produtos atualizados</h1>")
		produtos.forEach(produto => {
                document.write(
                "Id: " + produto.id + 
                " - Nome: " + produto.nome + 
                " - Preço: R$ " + produto.preco +
                "<br>"
            )
            })
            }else{
                document.write("Produto não encontrado!!")
            }
        }



    </script>
</body>
</html>
