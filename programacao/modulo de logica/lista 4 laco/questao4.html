<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x = 0
        let n1 = Number(prompt("digite o numero :"))
    

        while(x <= 10 ){
          
            document.write(" a tabuada é " + n1  +  "x"  + x + "=" +(x * n1) + "<br>")
            x++
        }
    </script>
</body>
</html>
