<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let anterior = Number(prompt("Digite o primeiro termo"))
let posterior = Number(prompt("Digite o segundo termo"))
let x = 0

document.write(anterior)
document.write(posterior)

while(x < 15){
    let proximo = anterior + posterior

    document.write(proximo)

    anterior = posterior
    posterior = proximo

    x++
}
    </script>
</body>
</html>
