<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x = 1
        let soma = 0
        let n1 = 0
        

        while(x <= 5){

           n1 =  Number(prompt("digite o numero:" ))
           soma = soma + n1
            x++
        }
         document.write("a soma dos numeros é: " + soma)
    </script>
</body>
</html>
