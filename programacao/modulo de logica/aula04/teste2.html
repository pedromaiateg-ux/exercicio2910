<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>porcentagem de 15% </title>
</head>
<body>
    <script>
        let salario = Number (prompt("qual é o seu salario"))
    
        let porcentual = salario * 0.15 
         document.write("o salario é:" + ( salario + porcentual) )
    

        
    
    </script>
</body>
</html>
