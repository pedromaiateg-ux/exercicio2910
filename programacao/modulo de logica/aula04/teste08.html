<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prestação</title>
</head>
<body>
    <script>
         let prestacao =Number(prompt("digite a prestacao"))
        let dias =Number(prompt("digite os dias"))
        let taxa =Number(prompt("digite a taxa"))
        document.write(" a prestacao e:" + prestacao + (prestacao *(taxa/100) * dias))
    </script>
</body>
</html>
