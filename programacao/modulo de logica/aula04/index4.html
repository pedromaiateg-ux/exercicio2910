<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>impar e par</title>
</head>
<body>
    <script>
        let numero = Number(prompt("digite um numero:"))
        if(numero % 2 == 0){
        document.write("par")
        }else{
            document.write("impar")
        }
    </script>
</body>
</html>
