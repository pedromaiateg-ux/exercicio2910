<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculo de dois numeros</title>
</head>
<body>
    Desenvolver um programa que pergunte ao usuário o seu nome completo e seu sexo. 
Em seguida, o programa deve apresentar os dados anteriormente informados.
<script>
    let nome = prompt("digite o seu nome: ")//serve para adicionar um valor a variavel 
    let sexo = prompt("digite o sexo: ")
    //mostrar o navegador 
    document.write("o nome é: "+ nome +" e o sexo é : " + sexo)
</script>
</body>

</html>
