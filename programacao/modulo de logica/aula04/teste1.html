<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>antecessor e sucessor </title>
</head>
<body>
    <script>
     let numero = Number(prompt("qual numero inteiro:"))
     if(numero >= 10 ){
        document.write("sucessor")

     }else{
        document.write("antecessor")
     }


    </script>
</body>
</html>
