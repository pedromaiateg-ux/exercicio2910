<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questao1</title>
</head>
<body>
    <script>

let v1 = Number(prompt("Digite 1º número"))
        let v2 = Number(prompt("Digite 2º número"))
        
        let operacao = prompt("Digite a operação + / * -")

        if(operacao == "+"){
            document.write("A soma dos valores é: " + (v1 + v2))
        }else if(operacao == "/"){
            document.write("A divisão dos valores é: " + (v1 / v2))
        }else if(operacao == "*"){
            document.write("A multiplicação dos valores é: " + (v1 * v2))
        }else if(operacao == "-"){
            document.write("A subtração dos valores é: " + (v1 - v2))
        }else{
            document.write("Valor inválido digite apenas os operadores aritméticos")
        }

    </script>
</body>
</html>
